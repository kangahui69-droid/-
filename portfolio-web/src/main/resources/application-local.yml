spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/techforge?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "${DB_PASSWORD:}"  # TODO: 设置本地数据库密码

jwt:
  secret: "${JWT_SECRET:}"  # TODO: 设置JWT密钥（至少256位）

minimax:
  api-key: "${MINIMAX_API_KEY:}"  # TODO: 设置MiniMax API Key
  model: "MiniMax-M2.5"
  api-url: "https://api.minimax.chat/v1/chat/completions"

ai:
  minimax:
    key: "${MINIMAX_API_KEY:}"  # TODO: 设置MiniMax API Key

logging:
  level:
    com.techforge: DEBUG
    org.hibernate.SQL: DEBUG