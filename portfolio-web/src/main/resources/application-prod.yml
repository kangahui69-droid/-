server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/techforge?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 你的服务器MySQL密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: 更换一个新的256位密钥-至少32个字符
  expiration: 86400000

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat

cors:
  allowed-origins: http://你的域名或IP
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

file:
  upload-dir: ./uploads

logging:
  level:
    com.techforge: INFO
    org.springframework.security: WARN